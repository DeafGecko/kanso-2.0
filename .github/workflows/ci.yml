name: CI

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    # Every 15 minutes, offset per project.
    - cron: '1,16,31,46 * * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and component tests
        run: npm test
